  <div class="cookie-banner">

      <p>
        <strong>🍪 Privacidade e Cookies</strong>
        Nós usamos cookies para analisar o tráfego e garantir que você tenha a melhor experiência em nosso site.

      <button class="btn-destaque btn-sm" (click)="aceitarCookies()">Entendi e Aceito</button>
    </div>
  </div>
}
